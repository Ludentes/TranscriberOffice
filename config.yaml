server:
  host: "0.0.0.0"
  port: 7860

model:
  # Options: "microsoft/VibeVoice-ASR" or "scerz/VibeVoice-ASR-4bit"
  path: "microsoft/VibeVoice-ASR"
  # Options: "auto", "bfloat16", "float16", "float32"
  dtype: "auto"
  # Local cache directory
  cache_dir: "./models"
  # Attention implementation: "sdpa", "eager" (flash_attention_2 requires separate install)
  attn_implementation: "sdpa"
  # Use quantized 4-bit model: "auto" (pre-Ampere GPUs), "true", "false"
  use_quantized: "true"
  # Multi-GPU: "auto" (use all GPUs if 2+), "single" (force 1 GPU), or "balanced_low_0"
  device_map: "auto"

transcription:
  max_file_size_mb: 500
  timeout_seconds: 1800
  default_max_new_tokens: 8192
  # Audio chunking settings (to prevent GPU OOM on long files)
  # Set to 0 for auto-calculation based on GPU memory
  chunk_threshold_minutes: 0  # 0 = auto, or minutes before splitting
  chunk_size_minutes: 0  # 0 = auto, or chunk duration in minutes
  chunk_overlap_seconds: 10  # Overlap between chunks (only used when no silence found)
  # Silence-based splitting (splits at natural pauses instead of fixed intervals)
  silence_split: true           # Enable silence-based splitting
  silence_noise_db: -30         # dB threshold for silence detection
  silence_min_duration: 0.5     # Minimum silence length in seconds
  silence_search_window: 30     # Seconds around target boundary to search for silence
